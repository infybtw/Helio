services:
  web:
    build:
      context: ./apps/web
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_API_BASE_URL: http://localhost:8080
    restart: unless-stopped

  tg_bot:
    build:
      context: ./apps/tg_bot
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://heliobot:heliobot@localhost:5432/heliobot
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  migrations:
    build:
      context: ./apps/migrations
    environment:
      DATABASE_URL: postgres://heliobot:heliobot@localhost:5432/heliobot?ssl=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-heliobot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heliobot}
      POSTGRES_DB: ${POSTGRES_DB:-heliobot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-heliobot} -d $${POSTGRES_DB:-heliobot}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
