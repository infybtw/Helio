services:
  web:
    build:
      context: ./apps/web
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_API_BASE_URL: http://localhost:8080
    restart: unless-stopped

  tg_bot:
    build:
      context: ./apps/tg_bot
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://heliobot:heliobot@postgres:5432/heliobot?sslmode=disable
      STT_URL: http://voice_recognizer:8000/stt
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  voice_recognizer:
    build:
      context: ./apps/voice_recognizer
    ports:
      - "8000:8000"
    environment:
      WHISPER_MODEL: small
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_CPU_THREADS: 4
      STT_MAX_UPLOAD_BYTES: 26214400
    volumes:
      - whisper_models:/root/.cache/huggingface
    restart: unless-stopped

  migrations:
    build:
      context: ./apps/migrations
    environment:
      DATABASE_URL: postgres://heliobot:heliobot@postgres:5432/heliobot?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: heliobot
      POSTGRES_PASSWORD: heliobot
      POSTGRES_DB: heliobot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heliobot -d heliobot"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  whisper_models:
