name: Publish Docker images

on:
  push:
    tags:
      - "*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            context: apps/web
            dockerfile: apps/web/Dockerfile
          - service: tg_bot
            context: apps/tg_bot
            dockerfile: apps/tg_bot/Dockerfile
          - service: migrations
            context: apps/migrations
            dockerfile: apps/migrations/Dockerfile
          - service: voice_recognizer
            context: apps/voice_recognizer
            dockerfile: apps/voice_recognizer/Dockerfile

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: infybtw/helio-${{ matrix.service }}
      VERSION: ${{ github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push version image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}

      - name: Tag version image as latest
        run: >-
          docker buildx imagetools create
          --tag "${REGISTRY}/${IMAGE_NAME}:latest"
          "${REGISTRY}/${IMAGE_NAME}:${VERSION}"
